<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Board</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>

<body class="text-white">
  <div class="container text-center">
    <h1 class="text-2xl text-center">📈 Stock Check</h1>

    <div id="stocks" class="space-y-3"></div>

    <div id="ownedList"></div>

    <div class="action-buttons">
      <button id="toggleFormBtn" class="toggle-btn">
        ➕ Add Option
      </button>

      <button id="toggleImportExportBtn" class="toggle-btn">
        📦 Import / Export
      </button>

      <button id="toggleOwnedBtn" class="toggle-btn">
        📈 Owned Shares
      </button>
    </div>

    <div id="sectionAddOption" class="hidden">
      <div class="pb-10">Add CALL or PUT Options</div>
      <form id="optionForm" class="option-form">
        <input type="text" id="tickerInput" placeholder="Ticker (e.g. FROG)" autocapitalize="characters" required />

        <select id="typeInput">
          <option value="CALL">CALL</option>
          <option value="PUT">PUT</option>
        </select>

        <input type="number" id="strikeInput" placeholder="Strike" min="10" max="1000" step="0.5" required />

        <input type="text" id="expiryInput" placeholder="Expiry (e.g. 17.8.)" />

        <button type="submit">Save</button>
      </form>
    </div>

    <div id="importExportSection" class="hidden">
      <div class="import-export">
        <div>Export</div>
        <div class="export-container position-relative">
          <textarea id="exportOutput" readonly placeholder="Export will appear here..."></textarea>
          <button id="copyBtn">📋</button>
        </div>
        <button id="exportBtn">📤 Export Options</button>

        <div class="import-title">Import</div>
        <textarea id="importInput" placeholder="Paste options JSON here..."></textarea>

        <button id="importBtn">📥 Import (Replace)</button>
      </div>
    </div>

    <div id="sectionOwned" class="hidden">
      <div class="pb-10">Add shares owned</div>
      <form id="ownedForm" class="option-form">
        <select id="ownedTickerInput" required></select>

        <select id="ownedAmountInput">
          <option value="1">1 Contract (100 shares)</option>
          <option value="2">2 Contracts</option>
          <option value="3">3 Contracts</option>
          <option value="4">4 Contracts</option>
          <option value="5">5 Contracts</option>
          <option value="6">6 Contracts</option>
          <option value="7">7 Contracts</option>
          <option value="8">8 Contracts</option>
          <option value="9">9 Contracts</option>
          <option value="10">10 Contracts</option>
        </select>
        <button type="submit">
          Save
        </button>
      </form>
    </div>
  </div>
  <footer id="statusBar" class="status-bar text-center">
    Status: <span class="status">Loading...</span>
    <span class="separator">|</span>
    <span class="date"></span>
  </footer>
</body>

</html>
